replicaCount: 1

image:
  repository: ghcr.io/stefanprodan/podinfo
  tag: "6.5.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9898

ingress:
  enabled: false

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

podinfo:
  level: info
  message: "Hello from Helm with PostgreSQL!"
  ui:
    color: "#34577c"

# PostgreSQL dependency settings
postgresql:
  enabled: true
  auth:
    username: podinfo
    password: changeme
    database: podinfo
  primary:
    persistence:
      enabled: false
# Для обратной совместимости с secret.yaml
auth:
  password: ""
